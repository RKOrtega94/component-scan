# Application Configuration for Services using Route Scanner

# Kafka Configuration (for route scanning)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=${spring.application.name}-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest

# Route Scanner Configuration
route.scanner.enabled=true
route.scanner.controller.enabled=true
route.scanner.swagger.enabled=true
route.scanner.kafka.topic=gateway-route-config
route.scanner.base-package=ec.com.ecommerce

# Swagger/OpenAPI Configuration
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true

# Logging
logging.level.ec.com.ecommerce.scanner=DEBUG
logging.level.org.springframework.kafka=INFO
